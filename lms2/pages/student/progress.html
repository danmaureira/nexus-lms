<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Progreso — Nexus LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/nexus.css">
  <style>
    .timeline { position:relative; padding-left:28px; }
    .timeline::before { content:""; position:absolute; left:10px; top:0; bottom:0; width:2px; background:var(--border); }
    .tl-item { position:relative; margin-bottom:16px; }
    .tl-dot  { position:absolute; left:-22px; top:4px; width:14px; height:14px; border-radius:50%; background:var(--p); border:2px solid white; box-shadow:0 0 0 2px var(--p-light); }
    .tl-dot.done { background:var(--success); box-shadow:0 0 0 2px var(--success-bg); }
    .tl-dot.locked { background:var(--border2); box-shadow:0 0 0 2px var(--border); }
    .tl-card { background:var(--white); border:1px solid var(--border); border-radius:var(--r-lg); padding:14px 16px; }
    .tl-card.done { border-color:var(--success-bg); background:var(--success-bg); }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content">
    <div class="page anim-fadeup">
      <div class="page-header"><h1>Mi Progreso</h1><p>Seguimiento detallado de tu avance en cada curso</p></div>

      <div class="stat-grid" style="margin-bottom:24px;">
        <div class="stat-card"><div class="num" id="sp-courses">0</div><div class="lbl">Cursos inscritos</div></div>
        <div class="stat-card accent"><div class="num" id="sp-modules">0</div><div class="lbl">Módulos completados</div></div>
        <div class="stat-card success"><div class="num" id="sp-subs">0</div><div class="lbl">Entregas realizadas</div></div>
        <div class="stat-card dark"><div class="num" id="sp-avg">0%</div><div class="lbl">Promedio general</div></div>
      </div>

      <div id="progress-container"></div>
    </div>
  </div>
</div>
<script src="../../js/core.js"></script>
<script src="../../js/layout.js"></script>
<script>
  const me = getSession(); if (!me) window.location.href = "../../index.html";
  buildStudentSidebar("progress");
  buildTopbar("Mi Progreso");

  const enrolled = me.enrolledCourses||[];
  let totalMods = 0, totalPct = 0;
  const mySubs = NexusDB.submissions.filter(s=>s.userId===me.id);

  document.getElementById("sp-courses").textContent = enrolled.length;
  document.getElementById("sp-subs").textContent    = mySubs.length;

  const cont = document.getElementById("progress-container");
  enrolled.forEach(cid => {
    const c = NexusDB.getCourse(cid); if (!c) return;
    const prog = NexusDB.getStudentProgress(me.id, cid);
    const pct  = NexusDB.getCourseProgress(me.id, cid);
    totalPct += pct;
    totalMods += prog.completedModules.length;

    const section = document.createElement("div");
    section.style.marginBottom = "28px";
    section.innerHTML = `
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
        <div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(${c.coverGradient||'135deg,var(--dk),var(--dk2)'})" ></div>
        <div style="flex:1;">
          <h2 style="font-size:1.05rem;margin-bottom:2px;">${c.title}</h2>
          <div style="font-size:12.5px;color:var(--dk3);">${c.duration} · ${prog.completedModules.length}/${c.modules.length} módulos</div>
        </div>
        <div style="text-align:right;">
          <div style="font-family:var(--font-d);font-size:1.5rem;font-weight:600;color:${pct===100?"var(--success)":"var(--p)"};">${pct}%</div>
          <div style="font-size:11px;color:var(--dk4);">${pct===100?"✅ Completado":"En progreso"}</div>
        </div>
      </div>
      <div class="prog-bar" style="margin-bottom:20px;height:8px;"><div class="prog-fill" style="width:${pct}%;${pct===100?"background:var(--success);":""}"></div></div>
      <div class="timeline" id="tl-${cid}"></div>`;
    cont.appendChild(section);

    const tl = document.getElementById("tl-"+cid);
    c.modules.forEach(mod => {
      const done   = prog.completedModules.includes(mod.id);
      const locked = mod.status==="locked"||(mod.unlockAfter&&!prog.completedModules.includes(mod.unlockAfter));
      const mySubsForMod = mySubs.filter(s=>s.courseId===cid&&s.moduleId===mod.id);
      const div = document.createElement("div");
      div.className = "tl-item";
      div.innerHTML = `
        <div class="tl-dot ${done?"done":locked?"locked":""}"></div>
        <div class="tl-card ${done?"done":""}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <div>
              <div style="font-size:14px;font-weight:600;">${mod.order}. ${mod.title}</div>
              <div style="font-size:12px;color:var(--dk3);margin-top:2px;">
                ${mod.resources.length} recursos · ${mod.activities.length} actividades
                ${mySubsForMod.length?` · <span style="color:var(--p);font-weight:600;">${mySubsForMod.length} entregada${mySubsForMod.length!==1?"s":""}</span>`:""}
              </div>
            </div>
            ${done
              ?'<span class="badge badge-success">✓ Completado</span>'
              :locked
                ?'<span class="badge badge-gray">Bloqueado</span>'
                :`<a class="btn btn-ghost btn-xs" href="course-view.html?id=${cid}">Continuar</a>`}
          </div>
          ${mySubsForMod.length?`
            <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.08);">
              ${mySubsForMod.map(s=>`
                <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:4px;">
                  <span>${typeIcon(s.type)}</span>
                  <span style="flex:1;color:var(--dk2);">Entrega del ${formatDate(s.submittedAt)}</span>
                  ${s.score!=null?`<span style="font-weight:700;color:var(--p);">${s.score} pts</span>`:""}
                  ${statusBadge(s.status)}
                </div>
                ${s.feedback?`<div style="font-size:12px;padding:6px 10px;background:rgba(0,0,0,.04);border-radius:6px;color:var(--dk2);margin-top:4px;">💬 ${s.feedback}</div>`:""}`).join("")}
            </div>`:""}
        </div>`;
      tl.appendChild(div);
    });
  });

  document.getElementById("sp-modules").textContent = totalMods;
  document.getElementById("sp-avg").textContent      = enrolled.length ? Math.round(totalPct/enrolled.length)+"%" : "0%";

  if (!enrolled.length) cont.innerHTML = `<div class="empty-state"><div class="icon">📈</div><h3>Sin cursos</h3><p>Inscríbete en un curso para ver tu progreso.</p></div>`;
</script>
</body>
</html>
