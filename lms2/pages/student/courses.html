<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Cursos — Nexus LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/nexus.css">
</head>
<body>
<div class="app-shell">
  <div class="main-content">
    <div class="page anim-fadeup">
      <div class="page-header"><h1>Mis Cursos</h1><p id="enrolled-label">Cargando...</p></div>
      <div class="grid-auto" id="courses-grid"></div>
    </div>
  </div>
</div>
<script src="../../js/core.js"></script>
<script src="../../js/layout.js"></script>
<script>
  const me = getSession(); if (!me) window.location.href = "../../index.html";
  buildStudentSidebar("courses");
  buildTopbar("Mis Cursos");

  const enrolled = me.enrolledCourses||[];
  document.getElementById("enrolled-label").textContent = `${enrolled.length} curso${enrolled.length!==1?"s":""} activo${enrolled.length!==1?"s":""}`;

  const grid = document.getElementById("courses-grid");
  enrolled.forEach(cid => {
    const c = NexusDB.getCourse(cid); if (!c) return;
    const teacher = NexusDB.getUser(c.teacherId);
    const pct = NexusDB.getCourseProgress(me.id, cid);
    const prog = NexusDB.getStudentProgress(me.id, cid);
    const pubMods = c.modules.filter(m=>m.status==="published").length;
    const div = document.createElement("div");
    div.className = "course-card";
    div.innerHTML = `
      <div class="course-cover" style="height:120px;position:relative;">
        <div class="course-cover-gradient" style="position:absolute;inset:0;background:linear-gradient(${c.coverGradient||'135deg,var(--dk),var(--dk2)'})"></div>
        <div style="position:absolute;bottom:12px;left:14px;right:14px;">
          <div style="font-family:var(--font-d);font-size:15px;font-weight:600;color:white;line-height:1.25;">${c.title}</div>
          <div style="font-size:11px;color:rgba(255,255,255,.7);margin-top:2px;">${c.category} · ${c.level}</div>
        </div>
      </div>
      <div class="course-body">
        <div style="font-size:12.5px;color:var(--dk3);margin-bottom:10px;">🎓 ${teacher?.name||"—"} · ${c.duration}</div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--dk3);margin-bottom:4px;">
          <span>Progreso</span><span style="font-weight:700;color:var(--p);">${pct}%</span>
        </div>
        <div class="prog-bar" style="margin-bottom:10px;"><div class="prog-fill" style="width:${pct}%"></div></div>
        <div style="font-size:12px;color:var(--dk4);">
          ${prog.completedModules.length} / ${pubMods} módulos completados ·
          ${prog.lastAccess?`Último acceso ${timeAgo(prog.lastAccess)}`:"No iniciado"}
        </div>
      </div>
      <div style="padding:12px 16px;border-top:1px solid var(--border);background:var(--surface);">
        <a class="btn btn-primary btn-sm" href="course-view.html?id=${c.id}" style="width:100%;justify-content:center;">${pct>0?"Continuar":"Comenzar"} →</a>
      </div>`;
    grid.appendChild(div);
  });

  if (!enrolled.length) grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">📚</div><h3>Sin cursos</h3><p>Aún no estás inscrito en ningún curso. Contacta al administrador.</p></div>`;
</script>
</body>
</html>
