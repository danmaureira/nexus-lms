<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso — Nexus LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/nexus.css">
  <style>
    .course-hero { border-radius: var(--r-xl); overflow: hidden; height: 160px; position: relative; margin-bottom: 24px; }
    .course-hero-bg { position:absolute;inset:0; }
    .course-hero-content { position:absolute; inset:0; padding:24px 28px; display:flex; flex-direction:column; justify-content:flex-end; }
    .course-hero-title { font-family:var(--font-d); font-size:1.5rem; font-weight:600; color:white; margin-bottom:4px; }
    .course-hero-meta  { font-size:13px; color:rgba(255,255,255,.7); }

    .module-accordion { border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; margin-bottom:12px; }
    .module-header { display:flex; align-items:center; gap:14px; padding:16px 20px; cursor:pointer; background:var(--white); transition:background .15s; user-select:none; }
    .module-header:hover { background:var(--p-mist); }
    .module-header.open { border-bottom:1px solid var(--border); }
    .module-num { width:36px; height:36px; border-radius:50%; background:var(--p); color:white; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; }
    .module-num.locked { background:var(--border); color:var(--dk4); }
    .module-num.done   { background:var(--success); }
    .module-info { flex:1; min-width:0; }
    .module-info h3 { font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .module-info p  { font-size:12.5px; color:var(--dk3); }
    .module-chevron { font-size:18px; color:var(--dk4); transition:transform .2s; flex-shrink:0; }
    .module-chevron.open { transform:rotate(180deg); }
    .module-body { background:var(--white); padding:20px; display:none; }
    .module-body.open { display:block; }

    .resource-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
    .resource-card { border:1.5px solid var(--border); border-radius:var(--r); padding:14px; cursor:pointer; transition:all .16s; display:flex;flex-direction:column;gap:8px; }
    .resource-card:hover { border-color:var(--p); background:var(--p-mist); }
    .res-icon  { font-size:24px; }
    .res-title { font-size:13px; font-weight:600; color:var(--dk); line-height:1.3; }
    .res-meta  { font-size:11.5px; color:var(--dk4); text-transform:uppercase; font-weight:600; }

    .activity-card { border:1px solid var(--border); border-radius:var(--r-lg); padding:16px; margin-bottom:10px; }
    .activity-card-header { display:flex;align-items:flex-start;gap:12px; margin-bottom:12px; }
    .activity-icon { width:40px;height:40px;border-radius:10px;background:var(--acc-light);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0; }
    .activity-icon.done { background:var(--success-bg);color:var(--success); }

    .sync-box { background:linear-gradient(135deg,var(--dk) 0%,var(--dk2) 100%); border-radius:var(--r-lg); padding:18px 22px; display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap; }
    .sync-box h4 { color:white; font-size:15px; margin-bottom:3px; }
    .sync-box p  { color:rgba(255,255,255,.65); font-size:13px; }

    .rubric-table { width:100%; border-collapse:collapse; font-size:13px; }
    .rubric-table th { background:var(--surface); padding:8px 10px; text-align:left; font-weight:700; font-size:12px; color:var(--dk3); border:1px solid var(--border); }
    .rubric-table td { padding:8px 10px; border:1px solid var(--border); vertical-align:top; }
    .rubric-table td.criteria-name { font-weight:600; color:var(--dk); background:var(--surface); }
    .rubric-level { padding:6px 8px; border-radius:6px; cursor:pointer; transition:background .15s; }
    .rubric-level:hover { background:var(--p-light); }
    .rubric-level.selected { background:var(--p); color:white; border-radius:6px; }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content">
    <div class="page anim-fadeup" id="page-content">
      <div class="empty-state"><div class="icon pulse">⊞</div><p>Cargando curso...</p></div>
    </div>
  </div>
</div>

<!-- MODAL RECURSO -->
<div class="modal-bg" id="modal-recurso">
  <div class="modal-box lg"><div class="modal-head"><h3 id="rec-modal-title">Recurso</h3><button class="modal-close" data-modal-close>×</button></div>
  <div class="modal-body" id="rec-modal-body"></div></div>
</div>

<!-- MODAL ACTIVIDAD -->
<div class="modal-bg" id="modal-actividad">
  <div class="modal-box lg"><div class="modal-head"><h3 id="act-modal-title">Actividad</h3><button class="modal-close" data-modal-close>×</button></div>
  <div class="modal-body" id="act-modal-body"></div>
  <div class="modal-foot" id="act-modal-foot"></div></div>
</div>

<script src="../../js/core.js"></script>
<script src="../../js/layout.js"></script>
<script>
  const me = getSession(); if (!me || me.role !== "student") window.location.href = "../../index.html";
  buildStudentSidebar("courses");
  initModals();

  const params = new URLSearchParams(window.location.search);
  const courseId = params.get("id");
  const course = NexusDB.getCourse(courseId);

  if (!course) {
    document.getElementById("page-content").innerHTML = `<div class="empty-state"><div class="icon">❌</div><h3>Curso no encontrado</h3><a href="courses.html" class="btn btn-ghost">← Volver</a></div>`;
  } else {
    buildTopbar(course.title.split(":")[0], ["Mis cursos", course.title.split(":")[0]]);
    const teacher = NexusDB.getUser(course.teacherId);
    const pg = NexusDB.getStudentProgress(me.id, courseId);
    const pct = NexusDB.getCourseProgress(me.id, courseId);

    document.getElementById("page-content").innerHTML = `
      <div class="course-hero">
        <div class="course-hero-bg" style="background:linear-gradient(${course.coverGradient||'135deg,var(--dk),var(--dk2)'})"></div>
        <div class="course-hero-content">
          <div style="margin-bottom:8px;"><span class="badge" style="background:rgba(255,255,255,.2);color:white;">${course.category}</span> <span class="badge" style="background:rgba(255,255,255,.15);color:white;">${course.level}</span></div>
          <div class="course-hero-title">${course.title}</div>
          <div class="course-hero-meta">🎓 ${teacher?.name||"—"} · ${course.duration} · ${pct}% completado</div>
        </div>
      </div>
      <div class="flex items-center gap-3 mb-6">
        <div class="prog-bar" style="flex:1;height:8px;"><div class="prog-fill" style="width:${pct}%"></div></div>
        <div style="font-size:13px;font-weight:600;color:var(--p);white-space:nowrap;">${pct}% completado</div>
      </div>
      <div id="modules-list"></div>`;

    const modList = document.getElementById("modules-list");
    course.modules.forEach((mod, idx) => {
      const done    = pg.completedModules.includes(mod.id);
      const locked  = mod.status === "locked";
      const prevDone = idx === 0 || pg.completedModules.includes(course.modules[idx-1]?.id);
      const isLocked = locked || (mod.unlockAfter && !prevDone);

      const numClass = done?"done":isLocked?"locked":"";
      const numIcon  = done?"✓":isLocked?"🔒":mod.order;

      const acc = document.createElement("div");
      acc.className = "module-accordion";
      acc.innerHTML = `
        <div class="module-header" id="mh-${mod.id}" onclick="toggleMod(${mod.id})">
          <div class="module-num ${numClass}">${numIcon}</div>
          <div class="module-info">
            <h3>${mod.title}</h3>
            <p>${mod.resources.length} recursos · ${mod.activities.length} actividades${done?" · ✅ Completado":""}</p>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            ${done?'<span class="badge badge-success">Completado</span>':isLocked?'<span class="badge badge-gray">Bloqueado</span>':'<span class="badge badge-primary">Disponible</span>'}
            <span class="module-chevron" id="mc-${mod.id}">▾</span>
          </div>
        </div>
        <div class="module-body" id="mb-${mod.id}"></div>`;
      modList.appendChild(acc);

      if (!isLocked) {
        const body = document.getElementById("mb-"+mod.id);
        // Resources
        if (mod.resources.length) {
          body.innerHTML += `<div class="divider-label"><span>Recursos</span></div><div class="resource-grid">${
            mod.resources.map(r=>`
              <div class="resource-card" onclick="openResource('${encodeURIComponent(JSON.stringify(r))}')">
                <div class="res-icon">${typeIcon(r.type)}</div>
                <div class="res-title">${r.title}</div>
                <div class="res-meta">${r.type}${r.size?" · "+r.size:""}</div>
              </div>`).join("")
          }</div>`;
        }
        // Activities
        if (mod.activities.length) {
          body.innerHTML += `<div class="divider-label"><span>Actividades</span></div>`;
          mod.activities.forEach(act => {
            const submitted = NexusDB.submissions.some(s=>s.courseId===courseId&&s.activityId===act.id&&s.userId===me.id);
            body.innerHTML += `
              <div class="activity-card">
                <div class="activity-card-header">
                  <div class="activity-icon${submitted?" done":""}">${submitted?"✓":typeIcon(act.type)}</div>
                  <div style="flex:1;">
                    <h4>${act.title} ${act.required?'<span class="badge badge-acc">Requerida</span>':""}</h4>
                    <p style="font-size:13px;margin-top:3px;">${act.instructions}</p>
                    ${act.dueDate?`<div style="font-size:12px;color:var(--dk3);margin-top:4px;">📅 Entrega: ${formatDate(act.dueDate)}</div>`:""}
                  </div>
                </div>
                ${act.rubric?`<button class="btn btn-ghost btn-xs" onclick="showRubric(${encodeURIComponent(JSON.stringify(act.rubric))})">Ver rúbrica</button> `:""}
                ${submitted
                  ? `<span class="badge badge-success">✓ Entregado</span>`
                  : `<button class="btn btn-primary btn-sm" onclick="openActivity('${courseId}','${mod.id}','${encodeURIComponent(JSON.stringify(act))}')">Entregar</button>`}
              </div>`;
          });
        }
        // Sync session
        const ss = mod.syncSession;
        body.innerHTML += `
          <div class="divider-label"><span>Sesión sincrónica</span></div>
          <div class="sync-box">
            <div>
              <h4>📡 ${ss.title}</h4>
              <p>📅 ${ss.date}</p>
              ${ss.description?`<p style="margin-top:4px;font-size:12px;">${ss.description}</p>`:""}
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              ${ss.zoomUrl?`<a class="btn btn-sm" href="${ss.zoomUrl}" target="_blank" style="background:#2D8CFF;color:white;">Unirse a Zoom</a>`:'<span style="font-size:13px;color:rgba(255,255,255,.5)">Próximamente</span>'}
              ${ss.recordingUrl?`<button class="btn btn-sm" style="background:#FF0000;color:white;" onclick="playRecording('${ss.recordingUrl}','${ss.title}')">▶ Grabación</button>`:""}
            </div>
          </div>`;
        // Complete btn
        if (!done) {
          body.innerHTML += `<div style="text-align:right;margin-top:16px;"><button class="btn btn-ghost btn-sm" onclick="markDone(${mod.id})">✓ Marcar módulo como completado</button></div>`;
        }
      } else {
        document.getElementById("mb-"+mod.id).innerHTML = `
          <div class="alert alert-warn" style="margin:0;">🔒 Este módulo se desbloqueará al completar el módulo anterior.</div>`;
      }
    });

    // Open first
    if (course.modules.length) toggleMod(course.modules[0].id);
  }

  function toggleMod(id) {
    const body = document.getElementById("mb-"+id);
    const chevron = document.getElementById("mc-"+id);
    const header  = document.getElementById("mh-"+id);
    const open = body.classList.contains("open");
    body.classList.toggle("open", !open);
    chevron.classList.toggle("open", !open);
    header.classList.toggle("open", !open);
  }

  function openResource(encoded) {
    const r = JSON.parse(decodeURIComponent(encoded));
    document.getElementById("rec-modal-title").textContent = r.title;
    let html = "";
    if (r.type === "video" || r.type === "genially") {
      html = `<div class="embed-wrap"><iframe src="${r.url}" allowfullscreen allow="autoplay"></iframe></div>`;
    } else if (r.type === "pdf") {
      html = `<div class="alert alert-info" style="margin-bottom:12px;">📄 Documento PDF</div><a class="btn btn-primary" href="${r.url}" target="_blank" style="width:100%;justify-content:center;">Abrir PDF</a>`;
    } else {
      html = `<a class="btn btn-outline" href="${r.url}" target="_blank" style="width:100%;justify-content:center;">Abrir enlace →</a>`;
    }
    document.getElementById("rec-modal-body").innerHTML = html;
    openModal("modal-recurso");
  }

  function playRecording(url, title) {
    document.getElementById("rec-modal-title").textContent = "Grabación — " + title;
    document.getElementById("rec-modal-body").innerHTML = `<div class="embed-wrap"><iframe src="${url}" allowfullscreen></iframe></div>`;
    openModal("modal-recurso");
  }

  function showRubric(encoded) {
    const rubric = JSON.parse(decodeURIComponent(encoded));
    document.getElementById("act-modal-title").textContent = rubric.title;
    let html = `<div class="alert alert-info mb-4">Esta rúbrica indica los criterios con que será evaluada tu entrega.</div>
      <table class="rubric-table"><thead><tr><th style="min-width:120px;">Criterio</th>`;
    rubric.criteria[0].levels.forEach((_,i) => html += `<th>Nivel ${i+1}</th>`);
    html += "</tr></thead><tbody>";
    rubric.criteria.forEach(c => {
      html += `<tr><td class="criteria-name">${c.name}</td>`;
      c.levels.forEach((l,i) => html += `<td><div class="rubric-level">${l} <span style="color:var(--p);font-size:11px;">(${c.weights[i]} pts)</span></div></td>`);
      html += "</tr>";
    });
    html += "</tbody></table>";
    document.getElementById("act-modal-body").innerHTML = html;
    document.getElementById("act-modal-foot").innerHTML = `<button class="btn btn-ghost" data-modal-close>Cerrar</button>`;
    openModal("modal-actividad");
  }

  function openActivity(courseId, moduleId, encoded) {
    const act = JSON.parse(decodeURIComponent(encoded));
    document.getElementById("act-modal-title").textContent = act.title;
    let formHtml = `<p style="font-size:14px;color:var(--dk2);margin-bottom:16px;">${act.instructions}</p>`;
    if (act.dueDate) formHtml += `<div class="alert alert-warn mb-4">📅 Fecha límite: ${formatDate(act.dueDate)}</div>`;
    if (act.rubric)  formHtml += `<button class="btn btn-ghost btn-xs mb-4" onclick="showRubric('${encodeURIComponent(JSON.stringify(act.rubric))}')">Ver rúbrica de evaluación</button>`;

    if (act.type === "forum" || act.type === "reflection") {
      formHtml += `<div class="form-group"><label class="form-label">Tu respuesta</label><textarea class="form-textarea" id="submission-text" rows="6" placeholder="Escribe aquí tu participación..."></textarea></div>`;
    } else if (act.type === "assignment") {
      formHtml += `
        <div class="form-group"><label class="form-label">Descripción de tu entrega</label><textarea class="form-textarea" id="submission-text" rows="4" placeholder="Describe brevemente tu trabajo..."></textarea></div>
        <div class="form-group"><label class="form-label">Adjuntar archivo</label><input type="file" class="form-input" id="submission-file" accept=".pdf,.docx,.pptx,.zip,.jpg,.png"><span class="form-hint">PDF, Word, PowerPoint o imágenes</span></div>`;
    } else if (act.type === "survey") {
      formHtml += `
        <div class="form-group"><label class="form-label">¿Cómo evalúas tu avance en este módulo? (1-5)</label>
          <div style="display:flex;gap:8px;margin-top:4px;">
            ${[1,2,3,4,5].map(n=>`<button onclick="selectRating(this,${n})" data-rating="${n}" class="btn btn-ghost btn-sm" style="width:44px;height:44px;padding:0;font-size:18px;border-radius:50%;">${["😕","🤔","😊","😀","🤩"][n-1]}</button>`).join("")}
          </div>
        </div>
        <div class="form-group"><label class="form-label">Comentarios (opcional)</label><textarea class="form-textarea" id="submission-text" rows="3" placeholder="¿Qué te resultó más útil? ¿Qué mejorarías?"></textarea></div>`;
    }

    document.getElementById("act-modal-body").innerHTML = formHtml;
    document.getElementById("act-modal-foot").innerHTML = `
      <button class="btn btn-ghost" data-modal-close>Cancelar</button>
      <button class="btn btn-primary" onclick="submitActivity('${courseId}','${moduleId}','${act.id}','${act.type}','${encodeURIComponent(act.title)}')">Entregar</button>`;
    openModal("modal-actividad");
  }

  function selectRating(btn, n) {
    document.querySelectorAll("[data-rating]").forEach(b => b.style.background="");
    btn.style.background = "var(--p-light)";
    btn.style.borderColor = "var(--p)";
  }

  function submitActivity(courseId, moduleId, actId, type, encodedTitle) {
    const title = decodeURIComponent(encodedTitle);
    const text  = document.getElementById("submission-text")?.value || "";
    const sub = {
      id: "sub-" + Date.now(),
      courseId, moduleId: parseInt(moduleId), activityId: actId,
      userId: me.id, userName: me.name,
      type, content: text, fileUrl: null, fileName: null,
      submittedAt: new Date().toISOString(),
      status: "submitted", score: null, feedback: "", rubricScores: null
    };
    NexusDB.submissions.push(sub);
    document.getElementById("act-modal-body").innerHTML = `
      <div class="empty-state"><div class="icon">✅</div><h3>¡Entrega recibida!</h3>
      <p>Tu respuesta fue guardada. El docente revisará tu trabajo y te enviará retroalimentación.</p></div>`;
    document.getElementById("act-modal-foot").innerHTML = `<button class="btn btn-primary" data-modal-close onclick="location.reload()">Aceptar</button>`;
  }

  function markDone(modId) {
    const u = NexusDB.getUser(me.id);
    if (!u.progress) u.progress = {};
    if (!u.progress[courseId]) u.progress[courseId] = { completedModules:[], submissions:{}, lastAccess: new Date().toISOString() };
    if (!u.progress[courseId].completedModules.includes(modId)) {
      u.progress[courseId].completedModules.push(modId);
      saveSession(u);
    }
    location.reload();
  }
</script>
</body>
</html>
